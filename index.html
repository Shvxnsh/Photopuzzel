<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101615">
  <title>Photopuzzel Camera</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="camera-app">
    <video id="cameraVideo" autoplay muted playsinline></video>
    <canvas id="handCanvas" aria-hidden="true"></canvas>
    <div class="shade"></div>

    <header class="topbar">
      <a class="brand" href=".">✳ photopuzzel</a>
      <span id="cameraStatus">Camera is off</span>
    </header>

    <section class="help" id="help">
      <p class="eyebrow">Nikon S3300 mood</p>
      <h1>Make a moment.</h1>
      <p>Allow camera access, then use both hands to make a frame. Hold it for three seconds.</p>
      <button id="startButton" class="action" type="button">Start camera</button>
      <label class="upload">or choose a photo<input id="fileInput" type="file" accept="image/*"></label>
      <p id="error" class="error" role="alert"></p>
    </section>

    <aside class="history" aria-label="Clicked photos history">
      <div class="history-head"><div><p class="eyebrow">Your moments</p><h2>Photo history</h2></div><button id="clearButton" class="clear" type="button">Clear</button></div>
      <div id="historyList" class="history-list"><p class="empty-history">Photos you capture will appear here.</p></div>
    </aside>

    <div id="countdown" class="countdown" hidden>3</div>
    <div class="bottom-bar">
      <span id="gestureStatus">Use both hands to make a frame</span>
      <button id="captureButton" class="capture" type="button" disabled>Capture</button>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="script.js"></script>
</body>
</html>
